name: AI Factory Automerge

on:
  workflow_run:
    workflows:
      - AI Factory Validate
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Safe Automerge
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: guard
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python .github/scripts/automerge_guard.py
      - name: Merge safe PR
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.guard.outputs.pr }} --squash --delete-branch
      - name: Skip reason
        if: steps.guard.outputs.allowed != 'true'
        run: |
          echo "Automerge skipped: ${{ steps.guard.outputs.reason }}"

