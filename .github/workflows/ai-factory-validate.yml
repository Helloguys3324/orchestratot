name: AI Factory Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # <--- ИСПРАВЛЕНИЕ: Скачиваем историю для guard_ai_workflows.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Compile Python
        run: python -m compileall backend skills_library run.py

      - name: Scan for committed secrets
        run: python .github/scripts/scan_secrets.py

      - name: Guard workflow files
        run: python .github/scripts/guard_ai_workflows.py

      - name: Run tests when present
        run: |
          if find . -path './.git' -prune -o -path './workspace' -prune -o -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest -q
          else
            echo "No root tests found."
          fi
