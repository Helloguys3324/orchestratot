name: AI Factory Jules

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "How many Jules tasks to start in this run"
        required: false
        default: "1"
      role:
        description: "Optional role override, for example tester or documenter"
        required: false
        default: ""
      starting_branch:
        description: "Branch Jules should start from"
        required: false
        default: "main"
      emergency_override:
        description: "Run even when AUTOPILOT_STOP exists"
        required: false
        default: "false"
      run_mode:
        description: "normal or meta"
        required: false
        default: "normal"

concurrency:
  group: ai-factory-jules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan Jules Batch
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
      batch_size: ${{ steps.plan.outputs.batch_size }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_BATCH_SIZE: ${{ inputs.batch_size }}
          REQUESTED_ROLE: ${{ inputs.role }}
          EMERGENCY_OVERRIDE: ${{ inputs.emergency_override }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: python .github/scripts/ai_factory_plan.py

  invoke:
    name: Jules ${{ matrix.slot }} - ${{ matrix.role }} / ${{ matrix.lane }}
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && needs.plan.outputs.batch_size != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Invoke Jules
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ inputs.starting_branch || 'main' }}
          include_commit_log: "true"
          include_last_commit: "false"
          prompt: |
            You are part of the AutoGen AI Factory.

            Task id: ${{ matrix.task_id }}
            Role: ${{ matrix.role }}
            Lane: ${{ matrix.lane }}
            Title: ${{ matrix.title }}

            Mission:
            Read mission.md and AGENTS.md first. Make one meaningful, focused improvement.

            Role instructions:
            ${{ matrix.role_prompt }}

            Lane constraints:
            ${{ matrix.lane_rules }}

            Write scope:
            ${{ matrix.write_scope }}

            Avoid scope:
            ${{ matrix.avoid_scope }}

            Risk level: ${{ matrix.risk_level }}
            Automerge allowed: ${{ matrix.automerge_allowed }}

            Assigned task:
            ${{ matrix.task_prompt }}

            Hard rules:
            - Keep the PR focused and normally under 300 changed lines.
            - Touch only files allowed by Write scope unless the task is impossible without a small adjacent change.
            - Do not touch files listed in Avoid scope.
            - Do not commit API keys, tokens, credentials, .env files, local databases, caches, or generated pyc files.
            - Do not modify data/settings.json except to remove secrets or preserve placeholders.
            - Never modify .github/workflows, .github/scripts, or .github/CODEOWNERS. Infrastructure changes require a human PR outside AI Factory.
            - Do not create cosmetic-only PRs.
            - If no meaningful safe change exists, report that and do not open a PR.
            - Never ask for clarification or human permission.
            - Do not ask questions in chat.
            - You must be completely autonomous: make the best engineering decision based on the constraints and implement it immediately.

            [STRICT VALIDATION PROTOCOL - REQUIRED]

            Run strict validation before finishing the task.

            Required validation commands from the repository root, whenever possible:

            python -m compileall backend skills_library run.py
            python .github/scripts/scan_secrets.py
            python -m pytest -q

            Additional validation:
            - If JSON files changed, validate JSON syntax.
            - If documentation changed, verify commands and claims are accurate.
            - If Mermaid diagrams changed, verify Mermaid syntax as much as possible.
            - If config or environment handling changed, verify no real secrets are added and no secret values are logged or stringified.

            [FRONTEND RUNTIME WALKTHROUGH - REQUIRED WHEN FRONTEND CHANGES]

            If any files in `frontend/` were changed, you must start the app and visually inspect the UI whenever the environment allows it.

            You must:
            1. Start the application locally using the documented command or the correct command inferred from the repository.
            2. Open the frontend in a browser or browser automation environment.
            3. Walk through the changed UI area and affected user flows.
            4. Record a short video of the walkthrough if supported.
            5. If video is not supported, capture screenshots.
            6. If screenshots are not supported, provide a detailed walkthrough log.
            7. Check browser console errors and obvious network errors when possible.
            8. Check loading, empty, error, and success states where relevant.
            9. Verify there are no obvious broken layouts, broken buttons, broken modals, missing files, or broken imports.

            [FRONTEND VISUAL REGRESSION CHECK - REQUIRED WHEN FRONTEND CHANGES]

            If frontend files changed, visual inspection is mandatory.

            The UI must not be considered complete if any of these issues are visible:
            - cards overlap;
            - text overlaps other text;
            - text escapes containers;
            - arrows or connectors cover important labels;
            - dashboard panels collide;
            - content is clipped unexpectedly;
            - fixed-position elements cover main content;
            - diagrams are unreadable;
            - horizontal overflow appears unintentionally;
            - vertical content is hidden without scroll;
            - layout breaks at common viewport sizes;
            - browser console shows runtime errors.

            When possible, test at least these viewport sizes:
            - 1440x900 desktop
            - 1280x720 laptop
            - 1024x768 tablet-like
            - 390x844 mobile-like, if responsive layout is expected

            If visual overlap, broken layout, unreadable diagram, clipped text, or obvious UI breakage is found, fix it before opening the PR.

            Do not open a PR that knowingly leaves the UI visually broken unless the PR explicitly documents the issue as unresolved and explains why it could not be fixed.

            PR body must include this exact section:

            ## Validation Results

            - `python -m compileall backend skills_library run.py`: PASSED / FAILED / NOT RUN
            - `python .github/scripts/scan_secrets.py`: PASSED / FAILED / NOT RUN
            - `python -m pytest -q`: PASSED / FAILED / NOT RUN
            - JSON validation: PASSED / FAILED / NOT APPLICABLE
            - Frontend validation: PASSED / FAILED / NOT APPLICABLE
            - Mermaid/documentation validation: PASSED / FAILED / NOT APPLICABLE

            ## Frontend Walkthrough

            - Frontend files changed: YES / NO
            - App start command: `...`
            - URL opened: `...`
            - Browser/runtime used: `...`
            - Walkthrough performed: YES / NO / NOT APPLICABLE
            - Video recorded: YES / NO / NOT SUPPORTED
            - Screenshots captured: YES / NO / NOT SUPPORTED
            - Console errors: NONE / LISTED BELOW / NOT CHECKED
            - Network errors: NONE / LISTED BELOW / NOT CHECKED
            - Visual issues found: NONE / LISTED BELOW / NOT CHECKED
            - Evidence location:
              - video: `...`
              - screenshots: `...`
              - trace/log: `...`

            Notes:
            - Explain every FAILED, NOT RUN, NOT CHECKED, or NOT SUPPORTED item.
            - Do not claim tests passed unless they actually passed.
            - Do not claim the UI works unless it was actually started and inspected.
            - Do not claim video evidence exists unless a real recording exists.
            - GitHub Actions validation is authoritative.

            PR title:
            ai-factory(${{ matrix.role }}): ${{ matrix.title }}

            Safe automerge:
            Only add label ai-factory:safe-automerge when the PR is docs-only or tests-only and validation passed. ф
